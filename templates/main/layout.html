{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'main/bootstrap/dist/css/bootstrap.css' %}">
    {% block link %}
    {% endblock %}
    <title>{% block title %} {% endblock %}</title>
</head>
<body>
<header>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a href="{% url 'home' %}" class="navbar-brand col-2">
                <img src="{% static 'main/img/header-footer/logo.png' %}" alt="">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
                    aria-controls="navbarContent"
                    aria-expanded="false"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse justify-content-center col-8" id="navbarContent">
                {% block links %} {% endblock %}
            </div>
            <div class="sign-button collapse navbar-collapse col-2" id="navbarContent"><a href="{% url 'record' %}">Записаться</a>
            </div>
        </div>
    </nav>
</header>
{% block content %} {% endblock %}
<footer>
    <div class="container">
        <div class="row footer-link">
            <div class="footer-logo col-sm-1 col-12">
                <img src="{% static 'main/img/header-footer/logo.png' %}" alt="" class="img-fluid">
            </div>
            <ul class="col-sm-11">
                {%block links-footer %} {% endblock %}
            </ul>
        </div>
        <div class="row footer-social-media">
            <a href="#" class="col-6 text-center"><img src="{% static 'main/img/header-footer/gmail.png' %}" alt=""></a>
            <a href="#" class="col-6 text-center"><img src="{% static 'main/img/header-footer/instagram.png' %}" alt=""></a>
        </div>
    </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="{% static 'main/js/main.js' %}"></script>
<script src="{% static 'main/js/itc-slider.js' %}" defer></script>
</body>
</html>
